<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: crimson;
            color: rgb(6, 212, 133);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 4px solid rgb(0, 0, 0);
            padding: 2px;
        }
        main {
            background-color: blue;
            color: hotpink;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor {
                font-weight: bold;
            }
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>    
         <h1>Site do 1B</h1>
         <p>Aprenda a produzir um Site</p>
    </header>
    <main>
        <img src="imagem.jpeg" alt="imagem da aula de educação Digital">
        <div>
            <h2>Exercício de aula do 1B</h2>
            <p class="autor">Por: Carlos Eduardo</p>
            <p>Este site e um Exercício da aula de Educação digital</p>
            <button>🤨​<span>0</span></button>
        </div>
    </main>
</body>
<script>
    const botao = document.querySelector ("button")
    botao.addEventListener("click", botaoClicado);
    function botaoClicado () {
        let texto = botao.querySelector ("span");
        texto.textContent++;
    }
</script>
</html>
